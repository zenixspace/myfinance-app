<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyFinance</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 16px;
      min-height: 100vh;
    }
    h1 { font-size: 22px; margin-bottom: 16px; text-align: center; }
    .card {
      background: #1e293b;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .balance-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 16px;
    }
    .balance-row:last-child { margin-bottom: 0; }
    .balance-total {
      font-weight: bold;
      font-size: 20px;
      border-top: 1px solid #334155;
      padding-top: 8px;
      margin-top: 8px;
    }
    .income { color: #4ade80; }
    .expense { color: #f87171; }
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 10px;
      cursor: pointer;
      color: #fff;
    }
    .btn-income { background: #16a34a; }
    .btn-expense { background: #dc2626; }
    .btn-refresh { background: #334155; }
    input, select {
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 16px;
    }
    .operation {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #334155;
      font-size: 14px;
    }
    .operation:last-child { border-bottom: none; }
    .hidden { display: none; }
    .error { color: #f87171; font-size: 14px; margin-top: 8px; text-align: center; }
  </style>
</head>
<body>
  <h1>💰 MyFinance</h1>

  <div class="card">
    <div class="balance-row">
      <span>📈 Доходы</span>
      <span class="income" id="income">—</span>
    </div>
    <div class="balance-row">
      <span>📉 Расходы</span>
      <span class="expense" id="expense">—</span>
    </div>
    <div class="balance-row balance-total">
      <span>💵 Остаток</span>
      <span id="balance">—</span>
    </div>
  </div>

  <button class="btn-income" onclick="showForm('income')">➕ Добавить доход</button>
  <button class="btn-expense" onclick="showForm('expense')">➖ Добавить расход</button>

  <div class="card hidden" id="form">
    <input type="number" id="amount" placeholder="Сумма, например 250" step="0.01" />
    <input type="text" id="category" placeholder="Категория, например еда" />
    <button class="btn-income" id="submitBtn" onclick="submitOperation()">Сохранить</button>
    <button class="btn-refresh" onclick="hideForm()">Отмена</button>
    <div class="error hidden" id="error"></div>
  </div>

  <button class="btn-refresh" onclick="loadData()">🔄 Обновить</button>
  <button class="btn-refresh" style="background: #7f1d1d;" onclick="resetAll()">🗑 Сбросить операции</button>
  <div class="card">
    <h3 style="margin-bottom: 10px; font-size: 16px;">📜 Последние операции</h3>
    <div id="history">Загрузка...</div>
  </div>

  <script>
    // ⚠️ ЗАМЕНИ ЭТУ ССЫЛКУ НА СВОЮ ИЗ NGROK
    const API_URL = "https://shrill-skewed-coleslaw.ngrok-free.dev";

    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // Получаем user_id из Telegram WebApp
    function getUserId() {
      if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
        return tg.initDataUnsafe.user.id;
      }
      // Fallback для теста в браузере
      return 5907608633;
    }

    const USER_ID = getUserId();
    let currentKind = "income";

    const headers = {
      "ngrok-skip-browser-warning": "true",
      "Content-Type": "application/json",
    };

    async function loadData() {
      try {const [balRes, histRes] = await Promise.all([
          fetch(`${API_URL}/balance?user_id=${USER_ID}`, { headers }),
          fetch(`${API_URL}/history?user_id=${USER_ID}&limit=10`, { headers }),
        ]);

        const bal = await balRes.json();
        const hist = await histRes.json();

        document.getElementById("income").textContent = bal.income.toFixed(2);
        document.getElementById("expense").textContent = bal.expense.toFixed(2);
        document.getElementById("balance").textContent = bal.balance.toFixed(2);

        renderHistory(hist);
      } catch (e) {
        document.getElementById("history").innerHTML =
          `<div class="error">Ошибка загрузки: ${e.message}</div>`;
      }
    }

    function renderHistory(items) {
      const el = document.getElementById("history");
      if (!items.length) {
        el.innerHTML = "<div>Пока операций нет.</div>";
        return;
      }
      el.innerHTML = items
        .map((op) => {
          const sign = op.kind === "income" ? "+" : "−";
          const cls = op.kind === "income" ? "income" : "expense";
          return `<div class="operation">
            <span>${op.category}</span>
            <span class="${cls}">${sign}${op.amount.toFixed(2)}</span>
          </div>`;
        })
        .join("");
    }

    function showForm(kind) {
      currentKind = kind;
      document.getElementById("form").classList.remove("hidden");
      document.getElementById("amount").value = "";
      document.getElementById("category").value = "";
      document.getElementById("error").classList.add("hidden");

      const btn = document.getElementById("submitBtn");
      btn.textContent = kind === "income" ? "Сохранить доход" : "Сохранить расход";
      btn.className = kind === "income" ? "btn-income" : "btn-expense";
    }

    function hideForm() {
      document.getElementById("form").classList.add("hidden");
    }
async function resetAll() {
  const confirmed = confirm("⚠️ Удалить ВСЕ операции? Это нельзя отменить.");
  if (!confirmed) return;

  try {
    const res = await fetch(
      `${API_URL}/reset/operations?user_id=${USER_ID}`,
      { method: "POST", headers }
    );
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || "Ошибка");

    loadData();
    if (tg) tg.HapticFeedback?.notificationOccurred("warning");
  } catch (e) {
    alert("Ошибка: " + e.message);
  }
}

    async function submitOperation() {
      const amount = parseFloat(document.getElementById("amount").value);
      const category = document.getElementById("category").value.trim();
      const errEl = document.getElementById("error");

      if (!amount || amount <= 0) {
        errEl.textContent = "Введи корректную сумму.";
        errEl.classList.remove("hidden");
        return;
      }
      if (!category) {
        errEl.textContent = "Введи категорию.";
        errEl.classList.remove("hidden");
        return;
      }

      try {
        const res = await fetch(`${API_URL}/operation`, {
          method: "POST",
          headers,
          body: JSON.stringify({
            user_id: USER_ID,
            kind: currentKind,
            amount,
            category,
          }),
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "Ошибка");

        hideForm();
        loadData();
        if (tg) tg.HapticFeedback?.notificationOccurred("success");
      } catch (e) {
        errEl.textContent = "Ошибка: " + e.message;
        errEl.classList.remove("hidden");
      }
    }

    loadData();
  </script>
</body>
</html>
